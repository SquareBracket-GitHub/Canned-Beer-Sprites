[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canned-beer"
version = "0.1.0"
description = "canned beer sprites - Sprite sheet and XML desktop tool"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
canned-beer = "canned_beer.app:main"

[tool.setuptools.packages.find]
include = ["canned_beer*"]
